<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hornitos - Colombia, Argentina, Chile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            color: white;
            padding: 40px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { 
            color: #FFD700; 
            font-size: 48px; 
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #ccc;
            margin-bottom: 40px;
            font-size: 18px;
        }
        .flags {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }
        .flag-btn {
            background: rgba(255,215,0,0.1);
            border: 2px solid #FFD700;
            color: white;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .flag-btn:hover {
            background: #FFD700;
            color: #5D3A1A;
            transform: scale(1.05);
        }
        .banner-container {
            display: flex;
            justify-content: center;
            margin: 40px 0;
        }
        .banner-frame {
            border: 5px solid #FFD700;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        iframe {
            border: none;
            display: block;
        }
        .ia-section {
            background: rgba(139,69,19,0.3);
            border-radius: 20px;
            padding: 30px;
            margin-top: 40px;
            border: 1px solid #FFD700;
        }
        .ia-title {
            color: #FFD700;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .ia-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .ia-grid { grid-template-columns: 1fr; }
        }
        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #FFD700;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
        }
        button {
            background: #FFD700;
            color: #5D3A1A;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,215,0,0.4);
        }
        .result {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            font-family: monospace;
            color: #a9dc76;
            border-left: 4px solid #FFD700;
            margin-top: 20px;
            white-space: pre-wrap;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥃 HORNITOS</h1>
        <div class="subtitle">Dynamic Banner · Colombia · Argentina · Chile</div>
        
        <div class="flags">
            <button class="flag-btn" onclick="changeCountry('CO')">🇨🇴 Colombia</button>
            <button class="flag-btn" onclick="changeCountry('AR')">🇦🇷 Argentina</button>
            <button class="flag-btn" onclick="changeCountry('CL')">🇨🇱 Chile</button>
        </div>
        
        <div class="banner-container">
            <div class="banner-frame">
                <iframe id="bannerFrame" src="/banner-vertical.html?country=CO" width="300" height="600"></iframe>
            </div>
        </div>
        
        <div class="ia-section">
            <div class="ia-title">🤖 Generar Contenido con IA</div>
            <div class="ia-grid">
                <div>
                    <label style="color: #FFD700; display: block; margin-bottom: 10px;">País</label>
                    <select id="countrySelect">
                        <option value="CO">🇨🇴 Colombia</option>
                        <option value="AR">🇦🇷 Argentina</option>
                        <option value="CL">🇨🇱 Chile</option>
                    </select>
                    
                    <label style="color: #FFD700; display: block; margin-bottom: 10px;">Prompt</label>
                    <input type="text" id="promptInput" placeholder="Ej: Tequila con limón" value="Margarita clásica">
                    
                    <button onclick="generateContent()">✨ Generar Nuevo Contenido</button>
                </div>
                <div>
                    <h3 style="color: #FFD700; margin-bottom: 15px;">Ejemplos rápidos</h3>
                    <button onclick="setPrompt('Tequila reposado añejo')" style="margin-bottom: 10px; background: rgba(255,215,0,0.2); color: white;">🥃 Tequila Reposado</button>
                    <button onclick="setPrompt('Margarita con sal')" style="margin-bottom: 10px; background: rgba(255,215,0,0.2); color: white;">🍹 Margarita</button>
                    <button onclick="setPrompt('Mezcal ahumado')" style="margin-bottom: 10px; background: rgba(255,215,0,0.2); color: white;">🔥 Mezcal</button>
                    <button onclick="setPrompt('Paloma de toronja')" style="margin-bottom: 10px; background: rgba(255,215,0,0.2); color: white;">🥤 Paloma</button>
                </div>
            </div>
            <div id="result" class="result">
                Haz clic en "Generar" para crear nuevo contenido
            </div>
            <div id="stats" class="stats">
                Cargando estadísticas...
            </div>
        </div>
    </div>

    <script>
        // Cambiar país del banner
        function changeCountry(country) {
            document.getElementById('bannerFrame').src = `/banner-vertical.html?country=${country}`;
        }
        
        // Set prompt
        function setPrompt(text) {
            document.getElementById('promptInput').value = text;
        }
        
        // Generar contenido
        async function generateContent() {
            const country = document.getElementById('countrySelect').value;
            const prompt = document.getElementById('promptInput').value;
            
            document.getElementById('result').textContent = '⏳ Generando contenido...';
            
            try {
                const response = await fetch('http://localhost:3000/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        brand: 'Hornitos',
                        country: country,
                        prompt: prompt
                    })
                });
                
                const data = await response.json();
                document.getElementById('result').textContent = JSON.stringify(data.content, null, 2);
                
                // Recargar banner
                const currentCountry = document.getElementById('bannerFrame').src.includes('country=') 
                    ? document.getElementById('bannerFrame').src.split('country=')[1].substring(0,2)
                    : 'CO';
                document.getElementById('bannerFrame').src = `/banner-vertical.html?country=${currentCountry}`;
                
                // Actualizar stats
                fetchStats();
                
            } catch (error) {
                document.getElementById('result').textContent = `Error: ${error.message}`;
            }
        }
        
        // Obtener estadísticas
        async function fetchStats() {
            try {
                const response = await fetch('http://localhost:3000/api/all');
                const data = await response.json();
                
                const co = data.contents.filter(c => c.country === 'CO').length;
                const ar = data.contents.filter(c => c.country === 'AR').length;
                const cl = data.contents.filter(c => c.country === 'CL').length;
                
                document.getElementById('stats').innerHTML = `
                    <span>🇨🇴 Colombia: ${co} registros</span>
                    <span>🇦🇷 Argentina: ${ar} registros</span>
                    <span>🇨🇱 Chile: ${cl} registros</span>
                    <span>📊 Total: ${data.total}</span>
                `;
            } catch (error) {
                document.getElementById('stats').innerHTML = 'Error cargando estadísticas';
            }
        }
        
        // Inicializar
        fetchStats();
    </script>
</body>
</html>

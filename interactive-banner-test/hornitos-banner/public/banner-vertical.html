<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hornitos - Banner</title>
    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 300px;
            height: 600px;
            background: linear-gradient(135deg, #8B4513, #5D3A1A);
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
            transition: background 0.5s;
        }
        
        .banner {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
            position: relative;
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: fadeIn 1s;
        }
        
        .badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,215,0,0.2);
            border: 1px solid #FFD700;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }
        
        .bottle {
            font-size: 100px;
            margin: 10px 0;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
            animation: fadeIn 1s;
        }
        
        .headline {
            font-size: 24px;
            font-weight: 900;
            margin: 15px 0;
            line-height: 1.2;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .description {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 30px;
            padding: 8px 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }
        
        .cta {
            background: #FFD700;
            color: #5D3A1A;
            border: none;
            padding: 15px 45px;
            border-radius: 40px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            letter-spacing: 1px;
            margin-top: 10px;
        }
        
        .cta:hover {
            transform: scale(1.1);
            background: #FFC800;
        }
        
        .footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            font-size: 12px;
            opacity: 0.7;
        }
        
        .error-message {
            display: none;
        }
    </style>
</head>
<body id="body">
    <div class="banner">
        <span class="badge" id="productBadge">Hornitos</span>
        <div class="logo">🥃 HORNITOS</div>
        <div class="bottle" id="bottleIcon">🏺</div>
        <div class="headline" id="headline">Cargando...</div>
        <div class="description" id="description">100% agave azul</div>
        <a href="#" class="cta" id="ctaButton" onclick="alert('¡Salud! Gracias por tu interés en Hornitos'); return false;">Descubrir</a>
        <div class="footer">🌵 Bebe con responsabilidad 🌵</div>
    </div>

    <script>
        // Obtener país de la URL
        function getCountry() {
            const params = new URLSearchParams(window.location.search);
            let country = params.get('country') || 'CO';
            // Solo permitir CO, AR, CL
            if (!['CO', 'AR', 'CL'].includes(country)) {
                country = 'CO';
            }
            return country;
        }

        // Nombres de países
        function getCountryName(code) {
            const names = {
                'CO': 'Colombia',
                'AR': 'Argentina',
                'CL': 'Chile'
            };
            return names[code] || 'Colombia';
        }

        // Cargar contenido
        async function loadContent() {
            try {
                const country = getCountry();
                const url = `http://localhost:3000/api/contents?brand=Hornitos&country=${country}`;
                
                console.log(`📡 Cargando contenido para ${getCountryName(country)}...`);
                
                const response = await fetch(url);
                const content = await response.json();
                
                console.log('✅ Contenido recibido:', content);
                
                // Actualizar todo
                document.getElementById('headline').textContent = content.headline || 'Hornitos';
                document.getElementById('ctaButton').textContent = content.cta || 'Descubrir';
                document.getElementById('productBadge').textContent = content.product || 'Tequila';
                document.getElementById('description').textContent = content.product || '100% agave azul';
                
                // Cambiar color de fondo
                if (content.bgColor) {
                    document.getElementById('body').style.background = 
                        `linear-gradient(135deg, ${content.bgColor}, ${adjustColor(content.bgColor, -30)})`;
                }
                
                // Cambiar ícono según producto
                const product = content.product || '';
                if (product.includes('Margarita')) document.getElementById('bottleIcon').textContent = '🍹';
                else if (product.includes('Paloma')) document.getElementById('bottleIcon').textContent = '🥤';
                else if (product.includes('Sunrise')) document.getElementById('bottleIcon').textContent = '🌅';
                else if (product.includes('Shot')) document.getElementById('bottleIcon').textContent = '🥃';
                else if (product.includes('Mezcal')) document.getElementById('bottleIcon').textContent = '🔥';
                else document.getElementById('bottleIcon').textContent = '🏺';
                
                // Animación
                if (content.animation) {
                    document.querySelector('.headline').style.animation = `${content.animation} 0.8s`;
                }
                
            } catch (error) {
                console.error('Error:', error);
                // Fallback: mostrar contenido por defecto
                document.getElementById('headline').textContent = 'Hornitos México';
                document.getElementById('ctaButton').textContent = 'Descubrir';
                document.getElementById('productBadge').textContent = 'Tequila';
            }
        }

        // Ajustar color
        function adjustColor(hex, percent) {
            if (!hex) return '#8B4513';
            try {
                let r = parseInt(hex.substring(1,3), 16);
                let g = parseInt(hex.substring(3,5), 16);
                let b = parseInt(hex.substring(5,7), 16);
                r = Math.max(0, Math.min(255, r + percent));
                g = Math.max(0, Math.min(255, g + percent));
                b = Math.max(0, Math.min(255, b + percent));
                return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
            } catch {
                return '#8B4513';
            }
        }

        // Cargar al inicio y cada 8 segundos
        loadContent();
        setInterval(loadContent, 8000);
    </script>
</body>
</html>

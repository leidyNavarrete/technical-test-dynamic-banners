<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adidas Weather</title>
  
  <base href="/interactive-banner-test/weather-banner/">
  
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval' data: blob:; style-src * 'unsafe-inline' data: blob:; img-src * data: blob:; connect-src * data: blob:; font-src * data: blob:;">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="banner banner-300x600 respirando">
   
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 100 50" width="60" height="30">
          <path d="M87.3,49.7L63.6,26L50.9,38.7L69.1,57L50.9,75.3L63.6,88L87.3,64.3L100,51.6L87.3,49.7z M36.4,26L12.7,49.7L0,51.6L12.7,64.3L36.4,88L49.1,75.3L30.9,57L49.1,38.7L36.4,26z"/>
        </svg>
      </div>
      <span class="brand-slogan">ADIDAS</span>
    </div>
    
  
    <div class="weather-container">
      <div class="city-info">
        <span class="city-icon">📍</span>
        <span class="city-name">MEDELLÍN</span>
      </div>
      <div class="weather-main">
        <div class="temperature">24<span class="temp-unit">°C</span></div>
        <span class="weather-icon">☀️</span>
      </div>
    </div>
    
    <div class="creative-message">
      ☀️ EL SOL NO ESPERA. ¿TÚ SÍ?
    </div>
    
 
    <a href="https://www.adidas.co" class="cta-button" target="_blank">DESCUBRE LA COLECCIÓN</a>
    
    
    <div class="particles-container"></div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
